[project]
name = "venturelab"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
    "httpx>=0.24.0",
    "mcp>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.pytest.ini_options]
testpaths = ["factory"]
norecursedirs = [
    "builds",
    "data/pack",
    "venturelab_factory_os",
    "venturelab_peer_review",
    "research/LLMRouterBench",
    ".venv*",
    "venv",
]
