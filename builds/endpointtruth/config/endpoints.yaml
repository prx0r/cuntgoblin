  # ---- Provider: local (live llama.cpp CPU server on this box, port 8080) ----
  - endpoint_id: "local:qwen2.5-0.5b-instruct"
    provider_id: "local"
    model_id: "qwen2.5-0.5b-instruct"
    provider_model_name: "qwen2.5-0.5b-instruct"
    base_url: "http://127.0.0.1:8080/v1"
    api_key_env: "NONE"
    region: "local-cpu"
    deployment_variant: "llama-cpp-b10472"
    quantization_state: "q4_k_m"
    tools_advertised: true
    json_advertised: true

  # ---- Provider: openrouter (advertised-only; live inference NOT_OBSERVED
