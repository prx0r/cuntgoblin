# EndpointTruth MVP — endpoint registry.
# No secrets live here: credentials are referenced by env var name only.
# api_key_env: "NONE" means a no-auth local endpoint.

endpoints:
  # ---- Provider: opencode-go (gateway this lab runs through) ----
  # base_url comes from OPENCODE_GO_BASE_URL; key from OPENCODE_GO_API_KEY.
  - endpoint_id: "opencode-go:deepseek-v4-flash"
    provider_id: "opencode-go"
    model_id: "deepseek-v4-flash"
    provider_model_name: "deepseek-v4-flash"
    base_url_env: "OPENCODE_GO_BASE_URL"
    api_key_env: "OPENCODE_GO_API_KEY"
    region: "gateway"
    deployment_variant: "opencode-go"
    tools_advertised: true
    json_advertised: true
