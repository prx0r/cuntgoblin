name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Repo hygiene
        run: |
          test ! -d .venv-agentsla
          ! git ls-files | grep -E '(^|/)(__pycache__/|.*\.pyc$)'

      - name: Tests
        run: pytest -q

      - name: Import checks
        run: |
          python -c "from api import app"
          python -c "from factory.system import VentureLabSystem"
          python -c "from factory.research.packet import ResearchGenerator"
          python -c "from factory.agenthub.kanban import HermesKanbanAdapter"
          python -c "from mcp.server import MCPServer"

      - name: DB migration
        run: python -c "from factory.db.migrate import migrate; migrate()"

      - name: Container build
        run: docker build -t venturelab:test .

      - name: Container smoke
        run: |
          docker run -d --rm --name venturelab-test -p 18000:8000 venturelab:test
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18000/health; then exit 0; fi
            sleep 1
          done
          docker logs venturelab-test
          exit 1
